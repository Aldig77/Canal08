name: build-gba
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          export PATH=$PATH:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
          make
      - uses: actions/upload-artifact@v4
        with:
          name: canal0-gba
          path: canal0.gba
